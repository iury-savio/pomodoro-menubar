name: Sync public mirror

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-public-mirror
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'iurysavio/pomodoro-menubar'
    runs-on: ubuntu-latest
    steps:
      - name: Check out primary repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push branches and tags to mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_GH_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "MIRROR_GH_TOKEN secret is missing."
            exit 1
          fi

          # checkout persists the GITHUB_TOKEN as a host-wide extra header.
          # Remove it so the mirror's cross-account credential is used instead.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/iury-savio/pomodoro-menubar.git"
          git push mirror --all
          git push mirror --tags

      - name: Copy published release and assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.MIRROR_GH_TOKEN }}
          GH_REPO: iury-savio/pomodoro-menubar
          SOURCE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          assets_dir="$(mktemp -d)"
          trap 'rm -rf "$assets_dir"' EXIT

          gh release download "$RELEASE_TAG" \
            --repo "$SOURCE_REPO" \
            --dir "$assets_dir" || true

          args=("$RELEASE_TAG" --repo "$GH_REPO" --title "$RELEASE_NAME" --notes "$RELEASE_BODY")
          if [ "$RELEASE_IS_DRAFT" = "true" ]; then args+=(--draft); fi
          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          for asset in "$assets_dir"/*; do
            [ -f "$asset" ] && args+=("$asset")
          done

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --title "$RELEASE_NAME" --notes "$RELEASE_BODY"
            for asset in "$assets_dir"/*; do
              [ -f "$asset" ] && gh release upload "$RELEASE_TAG" "$asset" --repo "$GH_REPO" --clobber
            done
          else
            gh release create "${args[@]}"
          fi
